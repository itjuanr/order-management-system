<div class="shell" [class.shell--nav-open]="navOpen">
  <aside class="sidebar">
    <a routerLink="/dashboard" class="brand" (click)="navOpen = false">
      <span class="brand-mark"><i class="fa-solid fa-boxes-stacked"></i></span>
      <span class="brand-name">Pedidos <small>Gerenciamento</small></span>
    </a>

    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="is-active" class="nav-link" (click)="navOpen = false">
        <i class="fa-solid fa-house"></i> Visão geral
      </a>

      <ng-container *ngFor="let group of navGroups">
        <span class="nav-label">{{ group.label }}</span>
        <a *ngFor="let item of group.items" [routerLink]="item.link" routerLinkActive="is-active" class="nav-link" (click)="navOpen = false">
          <i class="fa-solid" [ngClass]="item.icon"></i> {{ item.title }}
        </a>
      </ng-container>
    </nav>

    <div class="sidebar-footer">
      <span class="avatar">{{ username.charAt(0) }}</span>
      <div class="user">
        <strong>{{ username }}</strong>
        <span>Conectado</span>
      </div>
      <button type="button" class="icon-btn" title="Sair" aria-label="Sair" (click)="logout()">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>
  </aside>

  <div class="shell-backdrop" (click)="navOpen = false"></div>

  <div class="shell-main">
    <header class="topbar">
      <button type="button" class="icon-btn topbar-menu" aria-label="Abrir menu" (click)="navOpen = !navOpen">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span class="topbar-title">Gerenciamento de Pedidos</span>
      <button type="button" class="icon-btn" (click)="theme.toggle()"
        [title]="theme.isDark ? 'Usar tema claro' : 'Usar tema escuro'"
        [attr.aria-label]="theme.isDark ? 'Usar tema claro' : 'Usar tema escuro'">
        <i class="fa-solid" [ngClass]="theme.isDark ? 'fa-sun' : 'fa-moon'"></i>
      </button>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<section class="page">
  <header class="page-header">
    <div>
      <h1>Visão geral</h1>
      <p>Acompanhe os números do sistema e acesse cada módulo.</p>
    </div>
  </header>

  <div class="stats">
    <a *ngFor="let stat of stats" [routerLink]="stat.link" class="card stat">
      <span class="stat-icon"><i class="fa-solid" [ngClass]="stat.icon"></i></span>
      <div>
        <div class="stat-label">{{ stat.label }}</div>
        <div class="stat-value">{{ stat.value ?? '–' }}</div>
      </div>
    </a>
  </div>

  <h2 class="section-title">Módulos</h2>

  <div class="modules">
    <a *ngFor="let feature of dashboardFeatures" [routerLink]="feature.link" class="card module">
      <span class="module-icon"><i class="fa-solid" [ngClass]="feature.icon"></i></span>
      <div class="module-info">
        <h2>{{ feature.title }}</h2>
        <p>{{ feature.description }}</p>
      </div>
      <i class="fa-solid fa-arrow-right module-arrow"></i>
    </a>
  </div>
</section>
